function getGrammarType(x){const k = x.kanji;// 助詞
  if([
    "は","が","を","に（時間）","に（場所）","に（目的地）",
    "で（場所）","で（手段）","と","の","も","から","まで"
  ].includes(k)){
    return "🟣 助詞";
  }

  // 動詞文法
  if(
    k.includes("たい") ||
    k.includes("て") ||
    k.includes("ない") ||
    k.includes("たこと") ||
    k.includes("つもり") ||
    k.includes("予定") ||
    k.includes("ように") ||
    k.includes("ようと思います") ||
    k.includes("ことができます")
  ){
    return "🔵 動詞文法";
  }

  // 形容詞
  if(
    k === "い形容詞" ||
    k === "な形容詞" ||
    k.includes("ほうがいい") ||
    k === "いちばん" ||
    k.includes("ほど")
  ){
    return "🟢 形容詞";
  }

  // 疑問詞
  if([
    "どこ／どちら",
    "だれ／どなた",
    "なに／なん",
    "いつ",
    "どう",
    "どうして",
    "どのくらい",
    "いくつ",
    "どんな"
  ].includes(k)){
    return "❓ 疑問詞";
  }

  // 表現
  return "🟠 表現";
}

    const ek = esc(k);
