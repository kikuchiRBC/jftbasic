<title>JFT-BASIC漢字の読み方クイズ</title>

<style>
body{font-family: "Yu Gothic", sans-serif;
    text-align:center;
    background: linear-gradient(135deg,#8cfe4f,#fff41c);
    min-height:100vh;
    margin:0;
}

/* タイトル */
h1{ border:none;
    border-radius:12px;
    background:linear-gradient(45deg,#ffc156,#ffd52b);
    color:white;
    font-size:2.5rem;
    text-shadow:2px 2px 5px rgba(0,0,0,0.3);
    margin-top:20px;
}

.random-btn:hover{
    background-color: darkorange;
}

/* スコア */
#scoreBoard{
    position:fixed;
    top:15px;
    right:20px;
    background:rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    border-radius:15px;
    padding:15px 25px;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
    font-size:22px;
    font-weight:bold;
}
.firework{
    position: fixed;
    left: 50%;
    top: 50%;
    font-size: 30px;
    pointer-events: none;
    z-index: 99999;
    animation: explode 1.2s ease-out forwards;
}

@keyframes explode{
    0%{
        transform: translate(0,0) scale(0.5);
        opacity: 1;
    }

    100%{
        transform:
            translate(var(--x), var(--y))
            scale(1.5);
        opacity: 0;
    }
}
/* クイズエリア */
#quiz{
    width:600px;
    max-width:90%;
    margin:30px auto;
    background:rgba(255,255,255,0.95);
    border-radius:25px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
}

/* 漢字 */
#kanji{
    font-size:72px;
    font-weight:bold;
    color:#222;
    margin:30px 0;
}


.random-btn{
    background: linear-gradient(45deg,#2cff28,#0bc850) !important;
    color:white !important;
}

/* 問題数 */
#count{
    color:white;
    font-size:24px;
    font-weight:bold;
    margin-bottom:10px;
}

/* ボタン */



button:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(0,0,0,.3);
}

button:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

/* 正誤表示 */
#result{
    font-size:28px;
    font-weight:bold;
    margin:25px;
     color:red;
}

/* 次へボタン */
#next,
#nextSet{
    width:260px;
    background:linear-gradient(45deg,#00c853,#64dd17);
}
button{
    width:230px;
    margin:10px;
    padding:15px;
    font-size:24px;
    font-weight:bold;
    border:none;
    border-radius:12px;
    background:linear-gradient(45deg,#126798,#729aff);
    color:whitesmoke;
    cursor:pointer;
    transition:all .3s ease;



text-shadow:
    -1px -1px 0 rgb(61, 41, 153),
     1px -1px 0 rgb(61, 41, 153),
    -1px  1px 0 rgb(61, 41, 153),
     1px  1px 0 rgb(61, 41, 153);

}

#imageArea img{
    max-width:300px;
    max-height:250px;
    border-radius:10px;
    margin:15px 0;
    box-shadow:0 4px 10px rgba(0,0,0,.3);
}
/* ===== スマホ対応 ===== */
@media screen and (max-width: 768px){

    h1{
        font-size:1.4rem;
        margin:10px;
        padding:10px;
    }

    #scoreBoard{
        position:static;
        display:inline-block;
        margin:10px auto;
        font-size:18px;
        padding:10px 15px;
    }

    #quiz{
        width:95%;
        padding:15px;
        margin:10px auto;
        border-radius:15px;
    }

    #kanji{
        font-size:48px;
        margin:20px 0;
        word-break:break-word;
    }

    #count{
        font-size:18px;
        margin:10px 0;
    }

    button{
        width:100%;
        max-width:350px;
        font-size:20px;
        padding:14px;
        margin:8px auto;
        display:block;
    }

    #next,
    #nextSet{
        width:100%;
        max-width:350px;
    }

    #result{
        font-size:22px;
        line-height:1.5;
    }
}

/* 小型スマホ */
@media screen and (max-width: 480px){

    h1{
        font-size:1.2rem;
    }

    #kanji{
        font-size:38px;
    }

    button{
        font-size:18px;
        padding:12px;
    }

    #result{
        font-size:18px;
    }

    #scoreBoard{
        font-size:16px;
    }

    #count{
        font-size:16px;
    }
}
</style>

function makeChoices(q){

        let j=Math.floor(Math.random()*(i+1));
        [result[i],result[j]]=[result[j],result[i]];
    }

    return result;
}

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
    return array;
}

function showCorrectEffect(){

    const marks = ["✨","⭐","🌟","💚","💜","🟡","🟠"];

    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;

    for(let i = 0; i < 60; i++){

        const p = document.createElement("div");
        p.className = "firework";

        p.textContent =
            marks[Math.floor(Math.random()*marks.length)];

        p.style.left = centerX + "px";
        p.style.top = centerY + "px";

        const angle = Math.random() * Math.PI * 2;
        const distance = 150 + Math.random() * 250;

        p.style.setProperty(
            "--x",
            Math.cos(angle) * distance + "px"
        );

        p.style.setProperty(
            "--y",
            Math.sin(angle) * distance + "px"
        );

        document.body.appendChild(p);

        setTimeout(() => {
            p.remove();
        }, 1200);
    }
}
